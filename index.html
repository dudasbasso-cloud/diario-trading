<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diário de trading</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121317; --card: #1b1c21; --hair: rgba(255,255,255,0.07); --wash: rgba(255,255,255,0.04);
  --t1: #ecebe7; --t2: #b9b8b0; --t3: #8a8983;
  --pos: #9fd8b0; --neg: #f0a89e; --azul: #b8cdf5;
  --grid: #2a2b31; --base: #44454c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--t1); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding: max(16px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.muted { color: var(--t3); } .sec { color: var(--t2); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; margin: 12px 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.sub { font-size: 13px; color: var(--t3); margin: 0 0 12px; }

/* cadeado */
#cadeado { min-height: 80vh; display: grid; place-items: center; }
#cadeado form { width: 100%; max-width: 320px; text-align: center; }
#cadeado h1 { font-size: 22px; margin: 0 0 6px; }
#cadeado input { width: 100%; font: 600 28px/1 system-ui; letter-spacing: 10px; text-align: center; padding: 14px 10px 14px 20px; margin: 18px 0 12px;
  background: var(--card); color: var(--t1); border: 1px solid var(--hair); border-radius: 14px; outline: none; }
#cadeado input:focus { border-color: var(--base); }
#cadeado button { width: 100%; font: 600 16px system-ui; padding: 14px; border-radius: 14px; border: 0; background: var(--t1); color: #121317; }
#erro { min-height: 20px; font-size: 14px; color: var(--neg); }

/* topo */
header { padding: 6px 2px 2px; }
header .conta { font-size: 12px; letter-spacing: .08em; color: var(--t3); text-transform: uppercase; }
header h1 { font-size: 24px; margin: 2px 0 2px; }
.hero .label { font-size: 13px; color: var(--t2); }
.hero .valor { font-size: 52px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; margin: 4px 0 10px; }
.hero .contas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--hair); padding-top: 12px; }
.hero .contas div { font-size: 12px; color: var(--t3); }
.hero .contas b { display: block; font-size: 16px; color: var(--t1); font-weight: 600; margin-top: 2px; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.kpi { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 12px 14px; }
.kpi .l { font-size: 12.5px; color: var(--t2); }
.kpi .v { font-size: 22px; font-weight: 650; margin: 3px 0 1px; }
.kpi .d { font-size: 12px; color: var(--t3); }

/* gráficos */
.graf { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.graf svg { display: block; width: 100%; overflow: visible; }
.dica { position: absolute; top: 0; pointer-events: none; background: #26272d; border: 1px solid var(--hair); border-radius: 10px;
  padding: 7px 10px; font-size: 12.5px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; transition: opacity .12s; }
.dica b { display: block; font-size: 15px; }
.dica.on { opacity: 1; }

/* tabelas */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--t3); padding: 0 0 6px; }
td { padding: 9px 0; border-top: 1px solid var(--hair); }
th:not(:first-child), td:not(:first-child) { text-align: right; }

/* dias */
.mes { border-top: 1px solid var(--hair); }
.mes:first-of-type { border-top: 0; }
.mes > button { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 0 10px;
  background: none; border: 0; color: var(--t1); font: 600 15px system-ui; text-align: left; cursor: pointer; }
.mes > button .seta { color: var(--t3); font-weight: 400; display: inline-block; width: 14px; transition: transform .15s; }
.mes.aberto > button .seta { transform: rotate(90deg); }
.mes .corpo { display: none; padding-bottom: 6px; }
.mes.aberto .corpo { display: block; }
.dia > button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 0; border: 0; border-top: 1px solid var(--hair);
  background: none; color: var(--t1); font: inherit; text-align: left; cursor: pointer; }
.dia .nome { font-weight: 600; } .dia .meta { font-size: 12.5px; color: var(--t3); }
.dia .res { text-align: right; font-weight: 600; } .dia .fim { text-align: right; font-size: 12.5px; color: var(--t3); }
.dia .detalhe { display: none; padding: 2px 0 12px; }
.dia.aberto .detalhe { display: block; }
.op { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 10px; padding: 7px 0 7px 2px; font-size: 13.5px; border-top: 1px dashed transparent; }
.op + .op { border-top: 1px solid var(--wash); }
.op .h { color: var(--t3); }
.op .o2 { grid-column: 2 / 4; font-size: 12px; color: var(--t3); }
.tag { display: inline-block; font-size: 11px; color: var(--t2); border: 1px solid var(--hair); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.mov { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; padding: 7px 0 7px 2px; border-top: 1px solid var(--wash); }
.mov > span:last-child { white-space: nowrap; flex-shrink: 0; }
.mais { width: 100%; margin-top: 4px; padding: 10px; border-radius: 12px; border: 1px solid var(--hair); background: none; color: var(--t2); font: inherit; }
.abas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 14px 0 4px; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; }
.abas button { padding: 9px 0; border: 0; border-radius: 10px; background: none; color: var(--t2); font: 600 14.5px system-ui; cursor: pointer; }
.abas button[aria-selected="true"] { background: #2b2c33; color: var(--t1); }
.cartao .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.cartao .ativa { color: var(--pos); font-weight: 600; font-size: 14px; }
.cartao .mt { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: #2b2c33; color: var(--t1); }
.cartao .l2 { font-size: 13px; color: var(--t3); margin: 6px 0 12px; }
.cartao .caixa { background: var(--wash); border-radius: 12px; padding: 12px 14px; }
.cartao .total { font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
.cartao .nota { font-size: 12.5px; color: var(--t3); margin-top: 10px; }
table.soma td span.muted { display: block; font-size: 12px; }
table.soma tr.forte td { font-weight: 650; font-size: 16px; border-top: 1px solid var(--base); }
.fecho { font-size: 13.5px; color: var(--t2); margin: 12px 0 0; }
table.apertada { font-size: 13px; }
.lista .cab { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0; background: none; border: 0;
  color: var(--t1); font: 600 15px system-ui; text-align: left; cursor: pointer; }
.lista .seta { color: var(--t3); font-weight: 400; display: inline-block; width: 14px; transition: transform .15s; }
.lista.aberto .seta { transform: rotate(90deg); }
.lista .corpo { display: none; margin-top: 10px; }
.lista.aberto .corpo { display: block; }
footer { font-size: 12px; color: var(--t3); text-align: center; margin: 22px 0 0; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <section id="cadeado">
    <form autocomplete="off">
      <h1>Diário de trading</h1>
      <div class="muted">Escreve o código de 6 números</div>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="Código">
      <div id="erro" role="alert"></div>
      <button type="submit">Abrir</button>
    </form>
  </section>
  <div id="app" hidden></div>
</main>

const GUARDA = 'diario-beast-codigo'

// ---------- formatos ----------
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']
const SEM = ['dom','seg','ter','qua','qui','sex','sáb']
function grupos(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') }
function eur(x, dec = 2, sinal = false) {
  const a = Math.abs(x), i = Math.floor(Math.round(a * 10 ** dec) / 10 ** dec)
  const f = dec ? ',' + String(Math.round(a * 10 ** dec) % 10 ** dec).padStart(dec, '0') : ''
  const zero = Math.round(a * 10 ** dec) === 0
  const s = zero ? '' : x < 0 ? '−' : (sinal && x > 0 ? '+' : '')
  return s + grupos(i) + f + ' €'
}
function num(x, dec = 2) { const t = eur(x, dec).replace(' €', ''); return t }

// ---------- abrir o cofre ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
async function abrir(pin) {
  const enc = new TextEncoder()
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey'])
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(COFRE.salt), iterations: COFRE.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(COFRE.iv) }, k, b64(COFRE.ct))
  return JSON.parse(new TextDecoder().decode(pt))
}
async function tentar(pin, guardar) {
  try { const d = await abrir(pin); if (guardar) localStorage.setItem(GUARDA, pin); mostrar(d); return true }
  catch (e) { return false }
}
const form = document.querySelector('#cadeado form'), campo = document.getElementById('pin'), erro = document.getElementById('erro')
form.addEventListener('submit', async ev => {
  ev.preventDefault(); erro.textContent = 'A abrir…'
  if (!await tentar(campo.value.trim(), true)) { erro.textContent = 'Código errado'; campo.select() }
})
campo.addEventListener('input', () => { if (campo.value.length === 6) form.requestSubmit() })
;(async () => {
  const g = localStorage.getItem(GUARDA)
  if (!(g && await tentar(g, false))) campo.focus()
})()

function linhaDia(d) {
  const det = el('div', { class: 'detalhe' })
  const meta = [d.ops.length ? d.ops.length + (d.ops.length === 1 ? ' operação' : ' operações') + ' · ' + num(d.lot) + ' lotes' : 'sem operações']
  if (d.dep) meta.push('puseste ' + eur(d.dep, 0))
  if (d.lev) meta.push('tiraste ' + eur(d.lev, 0))
  const box = el('div', { class: 'dia' },
    el('button', { type: 'button' },
      el('span', { class: 'nome' }, diaCurto(d.dia)), el('span', { class: 'res num ' + cls(d.pl) }, d.ops.length ? eur(d.pl, 2, true) : ''),
      el('span', { class: 'meta' }, meta.join(' · ')), el('span', { class: 'fim num' }, 'fim do dia: ' + eur(d.fim))), det)
  box.firstChild.addEventListener('click', () => {
    if (!det.childNodes.length) {
      const mov = (t, v) => det.append(el('div', { class: 'mov num' }, el('span', { class: 'sec' }, t), el('span', { class: cls(v) }, eur(v, 2, true))))
      if (d.dep) mov('Depósitos', d.dep)

      for (const o of d.ops) {

        det.append(el('div', { class: 'op num' },
          el('span', { class: 'h' }, hora),
          el('span', {}, s + ' ', el('span', { class: 'sec' }, lado + ' ' + num(lot)), porque ? el('span', { class: 'tag' }, porque) : null),
          el('span', { class: cls(pl) }, eur(pl, 2, true)),
          el('span', { class: 'o2' }, preco(ab, casas) + ' → ' + preco(fe, casas) + ' · aberta ' + abriu)))

    box.classList.toggle('aberto')

}

// ---------- gráfico: resultado acumulado (linha) ----------
function escalaY(min, max, h, pad) {
  const passo = (() => { const r = (max - min) / 4, p = 10 ** Math.floor(Math.log10(r || 1)), n = r / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p })()
  const lo = Math.floor(min / passo) * passo, hi = Math.ceil(max / passo) * passo
  const y = v => pad.t + (hi - v) / (hi - lo || 1) * (h - pad.t - pad.b)
  const ticks = []; for (let v = lo; v <= hi + passo / 2; v += passo) ticks.push(v)
  return { y, ticks }
}
function curto(v) { const a = Math.abs(v), s = v < 0 ? '−' : v > 0 ? '+' : ''; return s + (a >= 1000 ? (a / 1000).toFixed(a % 1000 ? 1 : 0).replace('.', ',') + 'k' : String(Math.round(a))) }

function graficoAcum(box, dias) {
  const W = box.clientWidth, H = 210, pad = { t: 10, r: 6, b: 26, l: 40 }
  const vals = dias.map(d => d.acum)
  const { y, ticks } = escalaY(Math.min(0, ...vals), Math.max(0, ...vals), H, pad)
  const x = i => pad.l + (dias.length === 1 ? 0 : i / (dias.length - 1)) * (W - pad.l - pad.r)
  const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Resultado acumulado por dia de trading' })
  for (const v of ticks) {
    s.append(sv('line', { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--base)' : 'var(--grid)', 'stroke-width': 1 }))
    const t = sv('text', { x: pad.l - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--t3)', 'font-size': 11 }); t.textContent = curto(v); s.append(t)
  }
  let mesAnt = ''
  dias.forEach((d, i) => {
    const m = d.dia.slice(0, 7); if (m === mesAnt) return; mesAnt = m
    const t = sv('text', { x: x(i), y: H - 8, fill: 'var(--t3)', 'font-size': 11, 'text-anchor': i === 0 ? 'start' : 'middle' }); t.textContent = MES3[+m.slice(5) - 1]; s.append(t)
  })
  const pts = dias.map((d, i) => [x(i), y(d.acum)])
  const linha = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')
  s.append(sv('path', { d: linha + ` L${pts.at(-1)[0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`, fill: 'var(--azul)', 'fill-opacity': 0.10 }))
  s.append(sv('path', { d: linha, fill: 'none', stroke: 'var(--azul)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }))
  const fim = pts.at(-1)
  s.append(sv('circle', { cx: fim[0], cy: fim[1], r: 4, fill: 'var(--azul)', stroke: 'var(--card)', 'stroke-width': 2 }))
  const mira = sv('line', { y1: pad.t, y2: H - pad.b, stroke: 'var(--t3)', 'stroke-width': 1, opacity: 0 })
  const ponto = sv('circle', { r: 4, fill: 'var(--azul)', stroke: 'var(--card)', 'stroke-width': 2, opacity: 0 })
  s.append(mira, ponto); box.append(s)
  const dica = el('div', { class: 'dica num' }); box.append(dica)
  const mexe = ev => {
    const r = s.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left
    const i = Math.max(0, Math.min(dias.length - 1, Math.round((px - pad.l) / (W - pad.l - pad.r) * (dias.length - 1))))
    const d = dias[i], [cx, cy] = pts[i]
    mira.setAttribute('x1', cx); mira.setAttribute('x2', cx); mira.setAttribute('opacity', 1)
    ponto.setAttribute('cx', cx); ponto.setAttribute('cy', cy); ponto.setAttribute('opacity', 1)
    dica.textContent = ''
    dica.append(el('b', { class: cls(d.acum) }, eur(d.acum, 0, true)), el('span', { class: 'sec' }, diaCurto(d.dia) + ' · no dia ' + eur(d.pl + d.vt, 0, true)))
    dica.classList.add('on')
    const w = dica.offsetWidth; dica.style.left = Math.max(0, Math.min(W - w, cx - w / 2)) + 'px'; dica.style.top = Math.max(0, cy - 62) + 'px'
  }
  const sai = () => { dica.classList.remove('on'); mira.setAttribute('opacity', 0); ponto.setAttribute('opacity', 0) }
  s.addEventListener('pointermove', mexe); s.addEventListener('pointerdown', mexe); s.addEventListener('pointerleave', sai)
  s.addEventListener('touchmove', mexe, { passive: true }); s.addEventListener('touchend', () => setTimeout(sai, 1800))
}

// ---------- gráfico: por mês (barras para cima e para baixo do zero) ----------
function graficoMeses(box, meses) {
  const W = box.clientWidth, H = 190, pad = { t: 10, r: 6, b: 26, l: 40 }
  const vals = meses.map(m => m.pl)
  const { y, ticks } = escalaY(Math.min(0, ...vals), Math.max(0, ...vals), H, pad)
  const banda = (W - pad.l - pad.r) / meses.length, bw = Math.min(24, banda * 0.6)
  const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Lucro ou perda por mês' })
  for (const v of ticks) {
    s.append(sv('line', { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--base)' : 'var(--grid)', 'stroke-width': 1 }))
    const t = sv('text', { x: pad.l - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--t3)', 'font-size': 11 }); t.textContent = curto(v); s.append(t)
  }
  const dica = el('div', { class: 'dica num' })
  meses.forEach((m, i) => {
    const cx = pad.l + banda * (i + 0.5), y0 = y(0), y1 = y(m.pl), r = Math.min(4, Math.abs(y1 - y0), bw / 2)
    const sobe = m.pl >= 0, x0 = cx - bw / 2, x1 = cx + bw / 2
    const d = sobe
      ? `M${x0} ${y0} L${x0} ${y1 + r} Q${x0} ${y1} ${x0 + r} ${y1} L${x1 - r} ${y1} Q${x1} ${y1} ${x1} ${y1 + r} L${x1} ${y0} Z`
      : `M${x0} ${y0} L${x0} ${y1 - r} Q${x0} ${y1} ${x0 + r} ${y1} L${x1 - r} ${y1} Q${x1} ${y1} ${x1} ${y1 - r} L${x1} ${y0} Z`
    const barra = sv('path', { d, fill: sobe ? 'var(--pos)' : 'var(--neg)' })
    const alvo = sv('rect', { x: cx - banda / 2, y: pad.t, width: banda, height: H - pad.t - pad.b, fill: 'transparent', tabindex: 0 })
    const t = sv('text', { x: cx, y: H - 8, fill: 'var(--t3)', 'font-size': 11, 'text-anchor': 'middle' }); t.textContent = MES3[+m.m.slice(5) - 1]
    const ve = () => {
      for (const b of s.querySelectorAll('path')) b.setAttribute('opacity', 0.45); barra.setAttribute('opacity', 1)
      dica.textContent = ''; dica.append(el('b', { class: cls(m.pl) }, eur(m.pl, 0, true)), el('span', { class: 'sec' }, MESES[+m.m.slice(5) - 1] + ' · ' + m.ops + ' operações'))
      dica.classList.add('on'); const w = dica.offsetWidth; dica.style.left = Math.max(0, Math.min(W - w, cx - w / 2)) + 'px'; dica.style.top = Math.max(0, Math.min(y1, y0) - 58) + 'px'
    }
    const sai = () => { dica.classList.remove('on'); for (const b of s.querySelectorAll('path')) b.setAttribute('opacity', 1) }
    alvo.addEventListener('pointerenter', ve); alvo.addEventListener('pointerdown', ve); alvo.addEventListener('focus', ve)
    alvo.addEventListener('pointerleave', sai); alvo.addEventListener('blur', sai)
    s.append(barra, t, alvo)
  })
  box.append(s, dica)
}
</script>
